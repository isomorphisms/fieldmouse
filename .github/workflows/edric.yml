name: Edric rewrite

on:
  push:
    branches: [master, edric-rewrite]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 61970be77769f607cca8650bf424c0f0b22ddee7
          path: .tools/Idric

      - name: Restore Edric bootstrap cache
        id: edric-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/Idric/.tools
            .tools/Idric/bootstrap-build
            .tools/Idric/build
          key: edric-ubuntu24-x64-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Bootstrap Edric
        if: steps.edric-cache.outputs.cache-hit != 'true'
        working-directory: .tools/Idric
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          ./edric bootstrap

      - name: Save Edric bootstrap cache
        if: steps.edric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/Idric/.tools
            .tools/Idric/bootstrap-build
            .tools/Idric/build
          key: edric-ubuntu24-x64-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Add Edric toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/.tools/Idric/.tools/bin" >> "$GITHUB_PATH"

      - name: Compile Fieldmouse
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: .tools/Idric/build/exec/idris2 --build fieldmouse.ipkg

      - name: Run interpreter smoke test
        run: |
          output=$(build/exec/fieldmouse -e 'var total = 0; var i = 1; while (i <= 4) { total = total + i; i = i + 1; } console.log("sum", total); if (total === 10) console.log("ok");')
          printf '%s\n' "$output"
          test "$output" = "sum 10.0
          ok"

      - name: Test native text file I/O
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          path="$work/note.txt"
          script="$work/file-io.js"

          printf 'var path = "%s"; console.log(fileExists(path)); writeText(path, "old"); writeText(path, "alpha"); appendText(path, " beta"); console.log(fileExists(path)); console.log(readText(path));\n' "$path" > "$script"

          output=$(build/exec/fieldmouse "$script")
          printf '%s\n' "$output"
          test "$output" = "false
          true
          alpha beta"
          test "$(cat "$path")" = "alpha beta"

          if build/exec/fieldmouse -e "readText(\"$work/missing.txt\");" > "$work/missing.out" 2> "$work/missing.err"; then
            echo "readText unexpectedly succeeded for a missing file" >&2
            exit 1
          fi
          grep -F "fieldmouse: readText '$work/missing.txt': File Not Found" "$work/missing.err"

          if build/exec/fieldmouse -e 'writeText("only-one");' > "$work/arity.out" 2> "$work/arity.err"; then
            echo "writeText unexpectedly accepted one argument" >&2
            exit 1
          fi
          grep -F "fieldmouse: writeText: expected 2 arguments, found 1" "$work/arity.err"
